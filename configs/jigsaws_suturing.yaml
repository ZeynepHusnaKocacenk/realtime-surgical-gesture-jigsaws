# JIGSAWS Suturing: leave-one-user-out benchmark. Awaiting dataset access: nothing has been run for this task.
dataset: jigsaws
data_dir: data/JIGSAWS/Suturing        # JIGSAWS is not redistributed; place the task folder here
out: results/jigsaws_suturing
models: [TCN-causal, TCN-acausal, LSTM, BiLSTM]
